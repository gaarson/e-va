services:
  eva-sandbox:
    image: e-va-agent
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: eva-sandbox
    volumes:
      - ./docker/sandbox-workspace:/workspace
      - ${ENV_FILE:-../.env}:/opt/e-va/.env:ro
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8000/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-local_model}
      - EVA_STATUS_PORT=${EVA_STATUS_PORT:-8080}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/e-va/e-va && test -f /opt/e-va/agent.lua && test -x /usr/bin/google-chrome-stable || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stdin_open: true
    tty: true
    command: ["--pipe", "."]
